format_version = 2

# Keithley 7001 非矩阵卡的地址格式为 <slot>!<channel>。
[switchers.7001.channels]
ch1 = ["1!1", "1!11", "1!5", "1!15"]
ch2 = ["1!2", "1!12", "1!5", "1!15"]
ch3 = ["1!3", "1!13", "1!5", "1!15"]
ch4 = ["1!4", "1!14", "1!5", "1!15"]

# Keithley 3706A 使用四位全局通道号：槽号 + 三位卡内通道号。
[switchers.3706a.channels]
ch1 = ["1001", "1011", "1005", "1015"]
ch2 = ["1002", "1012", "1005", "1015"]
ch3 = ["1003", "1013", "1005", "1015"]
ch4 = ["1004", "1014", "1005", "1015"]
