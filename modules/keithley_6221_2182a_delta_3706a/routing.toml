format_version = 1

# 3706A 的 TSP 通道地址是“槽号 + 三位卡内通道号”，例如 Slot 1 的
# channel 1、11、5、15 分别写成 1001、1011、1005、1015。
# 不同开关卡的通道拓扑不同。接入真实仪表前必须按实际卡型和接线修改这里，
# 然后重启 OpenLab Control；界面只显示本文件路径，不显示具体接线路由。
[channels]
ch1 = ["1001", "1011", "1005", "1015"]
ch2 = ["1002", "1012", "1005", "1015"]
ch3 = ["1003", "1013", "1005", "1015"]
ch4 = ["1004", "1014", "1005", "1015"]
